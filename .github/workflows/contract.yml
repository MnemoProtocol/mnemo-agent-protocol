name: contract

# Machine-contract checks for the public files in this repo.
# These files are byte-identical copies of MnemoV2 docs/public/ (the only
# place they are edited). This workflow validates them and, on a daily
# schedule, reports drift against what https://www.trymnemo.com serves.
#
# Byte identity with MnemoV2 docs/public is enforced only on the MnemoV2
# side (its boundary tests). MnemoV2 is private, so this repo cannot compare
# against it without a token. On pull requests, the `live-compare` job
# reports (warnings only, never fails) which files differ from the live
# site; a hand edit shows up there, and the scheduled `drift` job fails on it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# Event name is part of the group so a push to main never cancels the daily
# drift run (and vice versa); only superseded PR runs are cancelled.
concurrency:
  group: contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate machine files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openapi-spec-validator (pinned with constraints)
        run: >-
          python -m pip install --disable-pip-version-check
          -c .github/constraints/contract.txt
          "openapi-spec-validator==0.9.0"

      - name: openapi.json is a valid OpenAPI document
        run: openapi-spec-validator openapi.json

      - name: agent-manifest.json is valid JSON
        run: |
          python -c 'import json; json.load(open("agent-manifest.json", encoding="utf-8")); print("agent-manifest.json: valid JSON")'

      - name: Payment wording and rails (single_verify never offers a card)
        run: python .github/scripts/check_payment_wording.py

  live-compare:
    name: compare with trymnemo.com (informational, PR only)
    # Informational: warnings only, always exits 0, never blocks a PR.
    # A sync PR from MnemoV2 is expected to differ from the live site until
    # the site deploys the same bytes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Compare sha256 with https://www.trymnemo.com/<file>
        shell: bash
        run: |
          set -uo pipefail
          base="https://www.trymnemo.com"
          {
            echo "### Machine files vs ${base} (informational)"
            echo
            echo "These files must be byte-identical copies of MnemoV2 docs/public. A difference here is expected on a sync PR before the site deploys; otherwise it may be a hand edit."
            echo
            echo "| file | PR sha256 | live sha256 | result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in llms.txt agent-protocol.md openapi.json agent-manifest.json examples/agent-quickstart.sh examples/agent_quickstart.py; do
            repo=$(sha256sum "$f" | cut -d' ' -f1)
            tmp=$(mktemp)
            if curl -fsSL --retry 3 --retry-all-errors --max-time 30 -o "$tmp" "${base}/${f}"; then
              live=$(sha256sum "$tmp" | cut -d' ' -f1)
            else
              live="fetch-failed"
            fi
            rm -f "$tmp"
            if [ "$repo" = "$live" ]; then
              result="match"
            else
              result="differs"
              echo "::warning file=${f}::${f} differs from ${base}/${f} (PR ${repo}, live ${live}). Expected on a MnemoV2 sync PR before deploy; never hand-edit this file."
            fi
            echo "${f}: pr=${repo} live=${live} ${result}"
            echo "| \`${f}\` | \`${repo:0:12}\` | \`${live:0:12}\` | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

  drift:
    name: drift vs trymnemo.com (scheduled, non-blocking for PRs)
    # Never runs on pull_request or push, so it cannot block a PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compare sha256 with https://www.trymnemo.com/<file>
        shell: bash
        run: |
          set -uo pipefail
          base="https://www.trymnemo.com"
          fail=0
          {
            echo "### Machine-file drift vs ${base}"
            echo
            echo "| file | repo sha256 | live sha256 | result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in llms.txt agent-protocol.md openapi.json agent-manifest.json examples/agent-quickstart.sh examples/agent_quickstart.py; do
            repo=$(sha256sum "$f" | cut -d' ' -f1)
            tmp=$(mktemp)
            if curl -fsSL --retry 3 --retry-all-errors --max-time 30 -o "$tmp" "${base}/${f}"; then
              live=$(sha256sum "$tmp" | cut -d' ' -f1)
            else
              live="fetch-failed"
            fi
            rm -f "$tmp"
            if [ "$repo" = "$live" ]; then
              result="match"
            else
              result="DRIFT"
              fail=1
              echo "::error file=${f}::${f} differs from ${base}/${f} (repo ${repo}, live ${live})"
            fi
            echo "${f}: repo=${repo} live=${live} ${result}"
            echo "| \`${f}\` | \`${repo:0:12}\` | \`${live:0:12}\` | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$fail"
